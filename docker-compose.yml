# Full stack: infrastructure + 7 Spring Boot services + Python AI agent + React UI.
#   cp .env.example .env   # add GEMINI_API_KEY (or set LLM_PROVIDER=fake to run offline)
#   docker compose up --build
x-spring: &spring
  restart: on-failure
  environment: &spring-env
    CONFIG_SERVER_URL: http://config-server:8888
    SPRING_CLOUD_CONFIG_FAIL_FAST: "true"
    EUREKA_URL: http://eureka-server:8761/eureka/
    POSTGRES_HOST: postgres
    RABBITMQ_HOST: rabbitmq
  depends_on: [config-server, eureka-server]

services:
  # ---------------------------------------------------------------- infrastructure
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - pgdata:/var/lib/postgresql/data
    ports: ["5432:5432"]

  rabbitmq:
    image: rabbitmq:3.13-management
    ports: ["5672:5672", "15672:15672"]

  chromadb:
    image: chromadb/chroma:1.5.9
    volumes: [chromadata:/data]
    ports: ["8001:8000"]

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    command: start-dev --import-realm --http-port=8181
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HOSTNAME: http://localhost:8181
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
    volumes:
      - ./infra/keycloak:/opt/keycloak/data/import:ro
    ports: ["8181:8181"]

  # ------------------------------------------------------------ platform services
  eureka-server:
    build: ./eureka-server
    ports: ["8761:8761"]

  config-server:
    build: ./config-server
    ports: ["8888:8888"]

  # ---------------------------------------------------------- business services
  user-service:
    <<: *spring
    build: ./user-service
    depends_on: [config-server, eureka-server, postgres]

  document-service:
    <<: *spring
    build: ./document-service
    environment:
      <<: *spring-env
      DOCUMENT_STORAGE_PATH: /data/documents
    volumes: [documents:/data/documents]
    depends_on: [config-server, eureka-server, postgres, rabbitmq]

  assistant-service:
    <<: *spring
    build: ./assistant-service
    environment:
      <<: *spring-env
      AI_AGENT_URL: http://ai-agent-service:8000
    depends_on: [config-server, eureka-server, postgres, ai-agent-service]

  mcp-server:
    <<: *spring
    build: ./mcp-server
    ports: ["8090:8090"]

  api-gateway:
    <<: *spring
    build: ./api-gateway
    environment:
      <<: *spring-env
      KEYCLOAK_ISSUER_URI: http://localhost:8181/realms/knowledge-assistant
      KEYCLOAK_JWKS_URI: http://keycloak:8181/realms/knowledge-assistant/protocol/openid-connect/certs
      CORS_ALLOWED_ORIGINS: http://localhost:5173,http://localhost:3000
    ports: ["8080:8080"]
    depends_on: [config-server, eureka-server, keycloak]

  # -------------------------------------------------------------------- AI agent
  ai-agent-service:
    build: ./ai-agent-service
    restart: on-failure
    environment:
      LLM_PROVIDER: ${LLM_PROVIDER:-gemini}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      CHROMA_MODE: http
      CHROMA_HOST: chromadb
      CHROMA_PORT: "8000"
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
      MCP_SERVER_URL: http://mcp-server:8090/sse
    ports: ["8000:8000"]
    depends_on: [chromadb, rabbitmq]

  # -------------------------------------------------------------------------- UI
  frontend:
    build: ./frontend
    ports: ["3000:80"]
    depends_on: [api-gateway]

volumes:
  pgdata:
  chromadata:
  documents:
