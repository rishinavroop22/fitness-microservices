server:
  port: 8083

spring:
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:5432/kb_assistant
    username: ${POSTGRES_USER:postgres}
    password: ${POSTGRES_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

agent:
  base-url: ${AI_AGENT_URL:http://localhost:8000}
  timeout: 90s
  history-turns: 6
